services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: milestone_ledger
      POSTGRES_USER: milestone_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-runtime-user.sh:/docker-entrypoint-initdb.d/10-init-runtime-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milestone_owner -d milestone_ledger"]
      interval: 5s
      timeout: 3s
      retries: 12

  bank-simulator:
    image: wiremock/wiremock:3.13.1
    ports:
      - "127.0.0.1:8089:8080"
    volumes:
      - ./demo/bank-simulator:/home/wiremock:ro
    command: ["--global-response-templating", "--disable-gzip"]

  app:
    build:
      context: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/milestone_ledger
      DB_USERNAME: milestone_app
      DB_PASSWORD: ${DB_APP_PASSWORD}
      DB_MIGRATION_URL: jdbc:postgresql://postgres:5432/milestone_ledger
      DB_MIGRATION_USERNAME: milestone_owner
      DB_MIGRATION_PASSWORD: ${DB_OWNER_PASSWORD}
      APP_SETUP_PROJECT_ID: ${APP_SETUP_PROJECT_ID}
      APP_SECURITY_CERTIFIER_PASSWORD_HASH: ${APP_SECURITY_CERTIFIER_PASSWORD_HASH}
      APP_SECURITY_ACCOUNTS_PASSWORD_HASH: ${APP_SECURITY_ACCOUNTS_PASSWORD_HASH}
      APP_SECURITY_MANAGER_PASSWORD_HASH: ${APP_SECURITY_MANAGER_PASSWORD_HASH}
      BANK_BASE_URL: http://bank-simulator:8080
      BANK_WEBHOOK_SIGNING_SECRET: ${BANK_WEBHOOK_SIGNING_SECRET}
      BANK_WEBHOOK_PROJECT_ID: ${BANK_WEBHOOK_PROJECT_ID}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      bank-simulator:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
