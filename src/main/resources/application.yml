spring:
  application:
    name: milestone-ledger
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 1000
  flyway:
    url: ${DB_MIGRATION_URL:${DB_URL}}
    user: ${DB_MIGRATION_USERNAME:${DB_USERNAME}}
    password: ${DB_MIGRATION_PASSWORD:${DB_PASSWORD}}
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful

app:
  setup:
    project-id: ${APP_SETUP_PROJECT_ID}
  security:
    certifier-password-hash: ${APP_SECURITY_CERTIFIER_PASSWORD_HASH}
    accounts-password-hash: ${APP_SECURITY_ACCOUNTS_PASSWORD_HASH}
    manager-password-hash: ${APP_SECURITY_MANAGER_PASSWORD_HASH}
  bank:
    base-url: ${BANK_BASE_URL:http://localhost:8089}
    webhook:
      source: ${BANK_WEBHOOK_SOURCE:demo-bank}
      project-id: ${BANK_WEBHOOK_PROJECT_ID}
      account-reference: ${BANK_WEBHOOK_ACCOUNT_REFERENCE:DEMO-ACCOUNT-001}
      signing-secret: ${BANK_WEBHOOK_SIGNING_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: ${APP_VERSION:0.1.0-SNAPSHOT}
    description: Certified milestone collections and payment reconciliation

logging:
  structured:
    json:
      exclude: error
    format:
      console: ecs
